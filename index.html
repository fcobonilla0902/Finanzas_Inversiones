<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2f5f8" />
    <meta
      name="description"
      content="Tu dinero, con claridad. Finanzas personales privadas."
    />
    <title>Finanzas · Tu dinero, con claridad</title>
    <script>
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("finanzas-theme") || "system";
        } catch {}
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#0c1724"
          : "#f2f5f8";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
